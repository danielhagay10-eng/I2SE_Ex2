<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רישום נוכחות - סטודנט</title>
    <!-- ספרייה לסריקת QR דרך המצלמה -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 30px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 100%; box-sizing: border-box; }
        input { width: 90%; padding: 12px; font-size: 16px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }
        .btn { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn:hover { background: #0056b3; }
        .btn:disabled { background: #cccccc; cursor: not-allowed; }
        .btn-scan { background: #28a745; }
        .btn-scan:hover { background: #218838; }
        .btn-stop-scan { background: #dc3545; }
        .btn-stop-scan:hover { background: #c82333; }
        
        #qrReaderContainer { display: none; margin: 15px 0; }
        #qrReader { width: 100%; border-radius: 8px; overflow: hidden; }
        
        .feedback-container { display: none; margin-top: 20px; }
        .action-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }
        .btn-green { background: #28a745; color: white; border: none; padding: 10px; font-size: 15px; border-radius: 5px; cursor: pointer; flex: 1; }
        .btn-blue { background: #17a2b8; color: white; border: none; padding: 10px; font-size: 15px; border-radius: 5px; cursor: pointer; flex: 1; }
        .btn-red { background: #dc3545; color: white; border: none; padding: 10px; font-size: 15px; border-radius: 5px; cursor: pointer; flex: 1; }
        
        #questionBox { display: none; margin-top: 15px; text-align: right; }
        #questionBox input { width: 100%; margin-bottom: 10px; box-sizing: border-box; }
        
        #statusMessage { margin-top: 20px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎓 רישום נוכחות לשיעור</h2>
        
        <div id="formSection">
            <h3 id="studentGreeting" style="color: #004085; margin-bottom: 5px;">שלום!</h3>
            <p style="color: #555; margin-top: 0;">סרוק את קוד ה-QR מהלוח או הזן אותו ידנית:</p>

            <!-- כפתור לפתיחת סורק המצלמה -->
            <button type="button" class="btn btn-scan" id="startScanBtn">📷 סרוק QR במצלמה</button>

            <!-- אזור המצלמה לסריקה -->
            <div id="qrReaderContainer">
                <div id="qrReader"></div>
                <button type="button" class="btn btn-stop-scan" id="stopScanBtn" style="margin-top: 10px;">✖ סגור סורק</button>
            </div>

            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

            <form id="attendanceForm">
                <input type="text" id="qrToken" placeholder="או הכנס קוד טוקן ידנית" required><br>
                <button type="button" class="btn" id="submitBtn">שלח נוכחות</button>
            </form>
        </div>

        <div id="waitingSection" class="feedback-container">
            <h3 style="color: #28a745;">✅ הנוכחות נקלטה בהצלחה!</h3>
            <p id="waitingText">ממתין לתחילת השיעור ולעדכונים מהמרצה...</p>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            
            <div class="action-buttons" id="actionButtons" style="display: none;">
                <button class="btn-green" id="greenBtn">👍 מובן</button>
                <button class="btn-blue" id="blueBtn">🙋‍♂️ מוכן לענות</button>
                <button class="btn-red" id="redBtn">✋ שאלה</button>
            </div>
            
            <div id="questionBox">
                <input type="text" id="questionText" placeholder="כתוב את השאלה שלך כאן...">
                <button class="btn" id="sendQuestionBtn" style="padding: 10px;">שלח שאלה</button>
            </div>

            <div id="feedbackStatus" style="margin-top: 15px; font-size: 14px; font-weight: bold;"></div>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        // שליפת פרטי הסטודנט מההתחברות (עם ברירת מחדל אם עדיין לא נשמרו ב-localStorage)
        const studentEmail = localStorage.getItem('user_email') || localStorage.getItem('student_email') || 'student@ariel.ac.il';
        const fullName = localStorage.getItem('user_name') || localStorage.getItem('student_name') || 'סטודנט לדוגמה';
        const nameParts = fullName.trim().split(' ');
        const studentFirstName = nameParts[0] || 'סטודנט';
        const studentLastName = nameParts.slice(1).join(' ') || 'אריאל';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('studentGreeting').innerText = `שלום, ${fullName} 👋`;
        });

        const submitBtn = document.getElementById('submitBtn');
        const qrTokenInput = document.getElementById('qrToken');
        const statusMessage = document.getElementById('statusMessage');
        
        const formSection = document.getElementById('formSection');
        const waitingSection = document.getElementById('waitingSection');
        const greenBtn = document.getElementById('greenBtn');
        const blueBtn = document.getElementById('blueBtn');
        const redBtn = document.getElementById('redBtn');
        const questionBox = document.getElementById('questionBox');
        const questionText = document.getElementById('questionText');
        const sendQuestionBtn = document.getElementById('sendQuestionBtn');
        const feedbackStatus = document.getElementById('feedbackStatus');

        const startScanBtn = document.getElementById('startScanBtn');
        const stopScanBtn = document.getElementById('stopScanBtn');
        const qrReaderContainer = document.getElementById('qrReaderContainer');

        let currentSessionId = "";
        let html5QrCode = null;

        // --- הפעלת סורק ה-QR ---
        startScanBtn.addEventListener('click', async () => {
            statusMessage.innerText = "";
            qrReaderContainer.style.display = "block";
            startScanBtn.style.display = "none";

            html5QrCode = new Html5Qrcode("qrReader");
            try {
                await html5QrCode.start(
                    { facingMode: "environment" }, // מצלמה אחורית בטלפון, או ברירת מחדל במחשב
                    { fps: 10, qrbox: { width: 220, height: 220 } },
                    async (decodedText) => {
                        // נקלט קוד QR! עוצרים מצלמה, ממלאים את השדה ושולחים אוטומטית
                        await stopQrScanner();
                        qrTokenInput.value = decodedText.trim().toUpperCase();
                        submitBtn.click();
                    },
                    () => {
                        // מתעלמים משגיאות פריימים ריקים בזמן הסריקה
                    }
                );
            } catch (err) {
                console.error(err);
                statusMessage.style.color = "red";
                statusMessage.innerText = "❌ לא ניתן לפתוח את המצלמה. ודא שנתת הרשאה בדפדפן.";
                qrReaderContainer.style.display = "none";
                startScanBtn.style.display = "block";
            }
        });

        async function stopQrScanner() {
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    html5QrCode.clear();
                } catch (e) {
                    console.error(e);
                }
                html5QrCode = null;
            }
            qrReaderContainer.style.display = "none";
            startScanBtn.style.display = "block";
        }

        stopScanBtn.addEventListener('click', stopQrScanner);

        // --- שליחת פרטי הנוכחות ובדיקת תחילת השיעור ---
        submitBtn.addEventListener('click', async function() {
            const qrToken = qrTokenInput.value.trim().toUpperCase();

            if (!qrToken) {
                statusMessage.style.color = "red";
                statusMessage.innerText = "נא לסרוק או להזין את קוד ה-QR!";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "שולח נוכחות...";
            statusMessage.innerText = "";

            try {
                const response = await fetch('/student/mark_attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_id: qrToken, 
                        student_id: studentEmail,
                        first_name: studentFirstName,
                        last_name: studentLastName
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    currentSessionId = qrToken;
                    
                    formSection.style.display = "none";
                    waitingSection.style.display = "block";
                    statusMessage.innerText = "";
                    
                    feedbackStatus.style.color = "orange";
                    feedbackStatus.innerText = "⏳ ממתין שהמרצה יסיים את הרישום...";
                    
                    // --- לוגיקת בדיקת הסטטוס כל 3 שניות ---
                    const statusInterval = setInterval(async () => {
                        try {
                            const res = await fetch(`/student/check_status/${qrToken}`);
                            const statusData = await res.json();
                            
                            if (statusData.status === 'active_participation') {
                                document.getElementById('actionButtons').style.display = "flex"; 
                                document.getElementById('waitingText').style.display = "none";
                                feedbackStatus.style.color = "green";
                                feedbackStatus.innerText = "✅ השיעור פעיל! ניתן להשתתף.";
                            } 
                            else if (statusData.status === 'muted') {
                                document.getElementById('actionButtons').style.display = "none"; 
                                document.getElementById('questionBox').style.display = "none";
                                document.getElementById('waitingText').style.display = "none";
                                feedbackStatus.style.color = "#dc3545";
                                feedbackStatus.innerText = "🔕 המרצה השתיק כרגע את כפתורי ההשתתפות.";
                            }
                            else if (statusData.status === 'ended') {
                                clearInterval(statusInterval);
                                alert('השיעור הסתיים! חוזר לדשבורד.');
                                window.location.href = '/student_dashboard.html';
                            }
                        } catch (e) {
                            console.error(e);
                        }
                    }, 3000);
                } else {
                    statusMessage.style.color = "red";
                    statusMessage.innerText = `❌ שגיאה: ${data.detail || "לא ניתן לרשום נוכחות"}`;
                }
            } catch (error) {
                console.error('Error:', error);
                statusMessage.style.color = "red";
                statusMessage.innerText = "❌ שגיאת תקשורת מול השרת.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "שלח נוכחות";
            }
        });

        // --- כפתור מובן ---
        greenBtn.addEventListener('click', async function() {
            questionBox.style.display = "none";
            feedbackStatus.style.color = "green";
            feedbackStatus.innerText = "✔ נשלח: הכל מובן";
            
            try {
                await fetch(`/student/understood?session_id=${currentSessionId}&student_id=${encodeURIComponent(studentEmail)}`, {
                    method: 'POST'
                });
            } catch (e) {
                console.error(e);
            }
        });

        // --- כפתור התנדבות ---
        blueBtn.addEventListener('click', async function() {
            questionBox.style.display = "none";
            feedbackStatus.style.color = "#17a2b8";
            feedbackStatus.innerText = "🙋‍♂️ המרצה עודכן שאתה מוכן לענות!";
            
            try {
                await fetch(`/student/volunteer?session_id=${currentSessionId}&student_id=${encodeURIComponent(studentEmail)}`, {
                    method: 'POST'
                });
                alert('כל הכבוד! נצברה נקודת השתתפות 🙋‍♂️');
            } catch (e) {
                console.error(e);
            }
        });

        // --- הצגת תיבת כתיבת שאלה ---
        redBtn.addEventListener('click', function() {
            feedbackStatus.innerText = "";
            questionBox.style.display = "block";
            questionText.focus();
        });

        // --- שליחת השאלה לשרת ---
        sendQuestionBtn.addEventListener('click', async function() {
            const qText = questionText.value.trim();
            if (!qText) return;

            feedbackStatus.style.color = "red";
            feedbackStatus.innerText = "✋ שאלתך נשלחה למרצה.";
            questionBox.style.display = "none";
            questionText.value = "";

            try {
                await fetch(`/student/ask_question?session_id=${currentSessionId}&student_id=${encodeURIComponent(studentEmail)}&question=${encodeURIComponent(qText)}`, {
                    method: 'POST'
                });
                alert('השאלה נשלחה בהצלחה! נצברה נקודת השתתפות ✋');
            } catch (e) {
                console.error(e);
            }
        });
    </script>

</body>
</html>
