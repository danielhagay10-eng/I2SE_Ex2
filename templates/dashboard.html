<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דשבורד מרצה - הקורסים שלי</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .navbar { background-color: #004085; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar h1 { margin: 0; font-size: 24px; }
        
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; text-align: center; }
        h2 { color: #333; margin-bottom: 30px; font-size: 28px; }
        
        .course-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px; 
        }
        
        .course-card {
            background: white; border-radius: 12px; padding: 40px 20px; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            font-size: 22px; font-weight: bold; color: #2c3e50; border: 1px solid #e1e8ed;
        }
        
        .course-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
            border-color: #007bff;
        }
        
        .add-course { 
            background: #e8f5e9; color: #2e7d32; border: 2px dashed #4caf50; 
        }
        
        .add-course:hover { background: #c8e6c9; border-color: #388e3c; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>🎓 SmartLMS</h1>
        <div class="user-info">שלום, כפיר (מרצה) | <a href="/" style="color: #ffcccc; text-decoration: none;">התנתק</a></div>
    </div>

    <div class="container">
        <h2>הקורסים שלי</h2>
        
        <div class="course-grid" id="courseList">
          <div class="course-card" onclick="window.location.href='/course_dashboard.html'">
    מבוא לחישוב
    <div style="font-size: 14px; color: #777; margin-top: 15px; font-weight: normal;">נפתח ב: 15/10/2026</div>
</div>
            
            <!-- כפתור הוספת קורס חדש -->
            <div class="course-card add-course" onclick="addNewCourse()">
                + הוסף קורס חדש
            </div>
        </div>
    </div>

    <script>
        // פונקציה ויזואלית להוספת קורס למסך
        function addNewCourse() {
            const newCourse = prompt("הכנס את שם הקורס החדש (לדוגמה: אינפי 1):");
            if (newCourse && newCourse.trim() !== "") {
                const grid = document.getElementById("courseList");
                const newCard = document.createElement("div");
                newCard.className = "course-card";
                newCard.innerText = newCourse;
                // בלחיצה על הקורס החדש, גם הוא יעביר לדשבורד הקורס הספציפי
                newCard.onclick = function() { window.location.href = '/course_dashboard.html'; };
                
                // מכניס את הקורס החדש לפני כפתור ה"הוסף"
                grid.insertBefore(newCard, grid.lastElementChild);
            }
        }
    </script>
</body>
</html>
