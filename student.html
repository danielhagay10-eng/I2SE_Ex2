<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רישום נוכחות - סטודנט</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 30px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 100%; box-sizing: border-box; }
        input { width: 90%; padding: 12px; font-size: 16px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }
        .btn { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; }
        .btn:hover { background: #0056b3; }
        .btn:disabled { background: #cccccc; cursor: not-allowed; }
        
        .feedback-container { display: none; margin-top: 20px; }
        .action-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }
        .btn-green { background: #28a745; color: white; border: none; padding: 10px; font-size: 15px; border-radius: 5px; cursor: pointer; flex: 1; }
        .btn-blue { background: #17a2b8; color: white; border: none; padding: 10px; font-size: 15px; border-radius: 5px; cursor: pointer; flex: 1; }
        .btn-red { background: #dc3545; color: white; border: none; padding: 10px; font-size: 15px; border-radius: 5px; cursor: pointer; flex: 1; }
        
        #questionBox { display: none; margin-top: 15px; text-align: right; }
        #questionBox input { width: 100%; margin-bottom: 10px; box-sizing: border-box; }
        
        #statusMessage { margin-top: 20px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎓 רישום נוכחות לשיעור</h2>
        
        <div id="formSection">
            <p>הכנס את פרטיך האישיים ואת קוד ה-QR:</p>
            <form id="attendanceForm">
                <input type="text" id="studentId" placeholder="תעודת זהות" required><br>
                <input type="text" id="firstName" placeholder="שם פרטי" required><br>
                <input type="text" id="lastName" placeholder="שם משפחה" required><br>
                <input type="text" id="qrToken" placeholder="הכנס קוד טוקן (QR)" required><br>
                <button type="button" class="btn" id="submitBtn">שלח נוכחות</button>
            </form>
        </div>

        <div id="waitingSection" class="feedback-container">
            <h3 style="color: #28a745;">✅ הנוכחות נקלטה בהצלחה!</h3>
            <p>ממתין לתחילת השיעור ולעדכונים מהמרצה...</p>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            
            <div class="action-buttons">
                <button class="btn-green" id="greenBtn">👍 מובן</button>
                <button class="btn-blue" id="blueBtn">🙋‍♂️ מוכן לענות</button>
                <button class="btn-red" id="redBtn">✋ שאלה</button>
            </div>
            
            <div id="questionBox">
                <input type="text" id="questionText" placeholder="כתוב את השאלה שלך כאן...">
                <button class="btn" id="sendQuestionBtn" style="padding: 10px;">שלח שאלה</button>
            </div>

            <div id="feedbackStatus" style="margin-top: 15px; font-size: 14px; font-weight: bold;"></div>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const studentIdInput = document.getElementById('studentId');
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const qrTokenInput = document.getElementById('qrToken');
        const statusMessage = document.getElementById('statusMessage');
        
        const formSection = document.getElementById('formSection');
        const waitingSection = document.getElementById('waitingSection');
        const greenBtn = document.getElementById('greenBtn');
        const blueBtn = document.getElementById('blueBtn');
        const redBtn = document.getElementById('redBtn');
        const questionBox = document.getElementById('questionBox');
        const questionText = document.getElementById('questionText');
        const sendQuestionBtn = document.getElementById('sendQuestionBtn');
        const feedbackStatus = document.getElementById('feedbackStatus');

        let currentStudentName = "";
        let currentSessionId = "";

        submitBtn.addEventListener('click', async function() {
            const studentId = studentIdInput.value.trim();
            const firstName = firstNameInput.value.trim();
            const lastName = lastNameInput.value.trim();
            const qrToken = qrTokenInput.value.trim();

            if (!studentId || !firstName || !lastName || !qrToken) {
                statusMessage.style.color = "red";
                statusMessage.innerText = "נא למלא את כל השדות!";
                return;
            }

            const idRegex = /^\d{9}$/;
            if (!idRegex.test(studentId)) {
                statusMessage.style.color = "red";
                statusMessage.innerText = "❌ תעודת זהות חייבת להכיל בדיוק 9 ספרות!";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "שולח נוכחות...";
            statusMessage.innerText = "";

            try {
                const response = await fetch('http://127.0.0.1:8000/student/mark_attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_id: qrToken, 
                        student_id: studentId,
                        first_name: firstName,
                        last_name: lastName
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    currentStudentName = firstName + " " + lastName;
                    currentSessionId = qrToken;
                    
                    formSection.style.display = "none";
                    waitingSection.style.display = "block";
                    statusMessage.innerText = "";
                } else {
                    statusMessage.style.color = "red";
                    statusMessage.innerText = `❌ שגיאה: ${data.detail || "לא ניתן לרשום נוכחות"}`;
                }
            } catch (error) {
                console.error('Error:', error);
                statusMessage.style.color = "red";
                statusMessage.innerText = "❌ שגיאת תקשורת מול השרת.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "שלח נוכחות";
            }
        });

        // כפתור ירוק
        greenBtn.addEventListener('click', function() {
            questionBox.style.display = "none";
            feedbackStatus.style.color = "green";
            feedbackStatus.innerText = "✔ נשלח: הכל מובן";
        });

        // כפתור כחול - מתנדב לענות
        blueBtn.addEventListener('click', async function() {
            const studentId = document.getElementById('studentId').value.trim();
            
            questionBox.style.display = "none";
            feedbackStatus.style.color = "#17a2b8";
            feedbackStatus.innerText = "🙋‍♂️ המרצה עודכן שאתה מוכן לענות!";
            
            try {
                await fetch(`http://127.0.0.1:8000/student/volunteer?session_id=${currentSessionId}&student_id=${studentId}`, {
                    method: 'POST'
                });
                alert('כל הכבוד! נצברה נקודת השתתפות 🙋‍♂️');
            } catch (e) {
                console.error(e);
            }
        });

        // כפתור אדום - פותח תיבת טקסט
        redBtn.addEventListener('click', function() {
            feedbackStatus.innerText = "";
            questionBox.style.display = "block";
            questionText.focus();
        });

        // שליחת השאלה הכתובה
        sendQuestionBtn.addEventListener('click', async function() {
            const studentId = document.getElementById('studentId').value.trim();
            const qText = questionText.value.trim();
            
            if (!qText) return;

            feedbackStatus.style.color = "red";
            feedbackStatus.innerText = "✋ שאלתך נשלחה למרצה.";
            questionBox.style.display = "none";
            questionText.value = ""; // איפוס הטקסט

            try {
                await fetch(`http://127.0.0.1:8000/student/ask_question?session_id=${currentSessionId}&student_id=${studentId}&question=${encodeURIComponent(qText)}`, {
                    method: 'POST'
                });
                alert('השאלה נשלחה בהצלחה! נצברה נקודת השתתפות ✋');
            } catch (e) {
                console.error(e);
            }
        });
    </script>

</body>
</html>
