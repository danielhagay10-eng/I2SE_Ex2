<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בקרה למרצה</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .dashboard { background: white; padding: 25px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        
        input[type="text"] { width: 60%; padding: 10px; font-size: 16px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; }
        
        #verificationSection { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #ccc; border-radius: 10px; background: #fafafa; }
        #cameraContainer { display: none; margin-top: 15px; }
        video { width: 100%; max-width: 400px; border-radius: 5px; border: 1px solid #ccc; }
        canvas { display: none; }
        #previewImage { width: 100%; max-width: 400px; border-radius: 5px; display: none; margin: 10px auto; }
        
        /* אזור ההתראות המרחפות בדפדפן */
        .toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #333; color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); font-size: 16px; opacity: 1; transition: opacity 1s; max-width: 300px; direction: rtl; position: relative; }
        .toast.hide { opacity: 0; }
        .toast.question { border-right: 5px solid #dc3545; }
        .toast.success { background: #28a745; border-right: 5px solid #1e7e34; }
        .close-toast { cursor: pointer; position: absolute; left: 10px; top: 10px; font-weight: bold; color: #ffcccc; font-size: 14px; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 80%; max-width: 500px; text-align: center; direction: rtl; }
        .modal-content table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .modal-content th, .modal-content td { padding: 10px; border: 1px solid #ddd; }
        .close-modal-btn { margin-top: 20px; background: #dc3545; color: white; border: none; padding: 10px; width: 100%; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>👨‍🏫 ניהול שיעור חכם</h2>
        
        <div id="startSection">
            <input type="text" id="lecturerId" placeholder="כתובת אימייל מרצה" required><br>
            <input type="text" id="courseName" placeholder="שם הקורס" required><br>
            <button class="btn" id="startSessionBtn">פתח שיעור והצג QR</button>
        </div>

        <div id="qrSection" style="display: none;">
            <h3 style="color: #007bff;">קוד השיעור: <span id="sessionTokenDisplay"></span></h3>
            <img id="qrImage" src="" style="margin: 15px auto; display: block; border: 5px solid white;">
            <button class="btn btn-danger" id="closeRegistrationBtn">סגור הרשמה ועבור לספירה</button>
        </div>

        <div id="verificationSection">
            <h3>📸 אימות נוכחות</h3>
            <button class="btn" id="openCameraBtn">📷 פתח מצלמה</button>
            <button class="btn" id="uploadImageBtn">📁 העלה תמונה</button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">

            <div id="cameraContainer">
                <video id="videoElement" autoplay playsinline></video><br>
                <button class="btn btn-success" id="captureBtn" style="display: none;">צלם תמונה</button>
            </div>
            
            <canvas id="canvasElement"></canvas>
            <img id="previewImage" alt="תצוגה מקדימה">
            <br>
            <button class="btn btn-success" id="analyzeBtn" style="display: none; margin-top: 15px; width: 100%;">אשר ספירה ושחרר כפתורים לתלמידים</button>
            <h4 id="analysisResult" style="color: #28a745;"></h4>
            
            <button class="btn btn-danger" id="endSessionBtn" style="display: none; margin-top: 15px; width: 100%;">🛑 סיים שיעור</button>
        </div>
    </div>

    <!-- כאן יופיעו ההודעות הצפות! -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-overlay" id="volunteerModal">
        <div class="modal-content">
            <h3>🙋‍♂️ מתנדבים</h3>
            <table><tbody id="volunteerTableBody"></tbody></table>
            <button class="close-modal-btn" id="closeModalBtn">סגור טבלה</button>
        </div>
    </div>

    <script>
        // בקשת הרשאה להתראות מערכת מחוץ לדפדפן ברגע שהדף עולה
        document.addEventListener('DOMContentLoaded', () => {
            if (Notification.permission !== "denied" && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        });

        const qrImage = document.getElementById('qrImage');
        const startSessionBtn = document.getElementById('startSessionBtn');
        const closeRegistrationBtn = document.getElementById('closeRegistrationBtn');
        const startSection = document.getElementById('startSection');
        const qrSection = document.getElementById('qrSection');
        const verificationSection = document.getElementById('verificationSection');
        const sessionTokenDisplay = document.getElementById('sessionTokenDisplay');
        
        let currentSessionToken = "";
        let stream = null;
        let liveUpdatesInterval = null;
        let totalUnderstood = 0; // מונה סטטיסטיקה

        async function updateSessionStatus(status) {
            await fetch('http://127.0.0.1:8000/lecturer/update_status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: currentSessionToken, status: status })
            });
        }

        startSessionBtn.addEventListener('click', async () => {
            const lecId = document.getElementById('lecturerId').value;
            const cName = document.getElementById('courseName').value;
            if (!lecId || !cName) return alert('נא למלא אימייל ושם קורס');
            
            currentSessionToken = Math.random().toString(36).substring(2, 10).toUpperCase();
            
            await fetch('http://127.0.0.1:8000/lecturer/start_session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: currentSessionToken, lecturer_id: lecId, course_name: cName })
            });

            startSection.style.display = 'none';
            qrSection.style.display = 'block';
            sessionTokenDisplay.innerText = currentSessionToken;
            qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${currentSessionToken}`;
        });

        closeRegistrationBtn.addEventListener('click', async () => {
            await updateSessionStatus('counting');
            qrSection.style.display = 'none';
            verificationSection.style.display = 'block';
        });

        const videoElement = document.getElementById('videoElement');
        const cameraContainer = document.getElementById('cameraContainer');
        const captureBtn = document.getElementById('captureBtn');
        const previewImage = document.getElementById('previewImage');
        const canvasElement = document.getElementById('canvasElement');
        const analyzeBtn = document.getElementById('analyzeBtn');

        document.getElementById('openCameraBtn').addEventListener('click', async () => {
            previewImage.style.display = "none";
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            videoElement.srcObject = stream;
            cameraContainer.style.display = "block";
            captureBtn.style.display = "inline-block";
        });

        captureBtn.addEventListener('click', () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasElement.getContext('2d').drawImage(videoElement, 0, 0);
            previewImage.src = canvasElement.toDataURL('image/jpeg');
            previewImage.style.display = "block";
            
            stream.getTracks().forEach(track => track.stop());
            cameraContainer.style.display = "none";
            analyzeBtn.style.display = "inline-block";
        });

        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const fileInput = document.getElementById('fileInput');
        uploadImageBtn.addEventListener('click', () => { fileInput.click(); });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImage.src = event.target.result;
                    previewImage.style.display = "block";
                    cameraContainer.style.display = "none";
                    if (stream) { stream.getTracks().forEach(track => track.stop()); }
                    analyzeBtn.style.display = "inline-block";
                };
                reader.readAsDataURL(file);
            }
        });

        analyzeBtn.addEventListener('click', async () => {
            analyzeBtn.innerText = "מעבד...";
            analyzeBtn.disabled = true;
            
            setTimeout(async () => {
                document.getElementById('analysisResult').innerText = "✅ נספרו התלמידים. הכפתורים לתלמידים נפתחו.";
                analyzeBtn.style.display = "none";
                document.getElementById('endSessionBtn').style.display = "inline-block";
                
                await updateSessionStatus('active_participation');
                liveUpdatesInterval = setInterval(fetchLiveUpdates, 3000);
            }, 1000);
        });

        document.getElementById('endSessionBtn').addEventListener('click', async () => {
            await updateSessionStatus('ended');
            document.getElementById('endSessionBtn').style.display = "none";
            document.getElementById('analysisResult').innerText = "🛑 השיעור נגמר בהצלחה.";
            document.getElementById('analysisResult').style.color = "red";
            if (liveUpdatesInterval) clearInterval(liveUpdatesInterval);
        });

        // פונקציה לשליחת התראה למערכת ההפעלה (Windows/Mac)
        function sendDesktopNotification(title, body) {
            if (Notification.permission === "granted") {
                new Notification(title, { body: body });
            }
        }

        // משיכת התראות בזמן אמת מהשרת
        async function fetchLiveUpdates() {
            try {
                const res = await fetch(`http://127.0.0.1:8000/lecturer/live_updates/${currentSessionToken}`);
                const data = await res.json();
                
                // 1. שאלות
                if (data.questions && data.questions.length > 0) {
                    data.questions.forEach(q => {
                        const msg = `${q.name}: ${q.text}`;
                        showToast(`<strong>${q.name}:</strong> ${q.text}`, 'question');
                        sendDesktopNotification("✋ שאלה חדשה מהכיתה!", msg); // התראה בווינדוס
                    });
                }
                
                // 2. מתנדבים
                if (data.volunteers && data.volunteers.length > 0) {
                    const studentsArray = data.volunteers.map(name => ({ name: name }));
                    openVolunteerModal(studentsArray);
                    sendDesktopNotification("🙋‍♂️ מתנדב חדש!", "יש תלמיד שמוכן לענות"); // התראה בווינדוס
                }
                
                // 3. מובן (סטטיסטיקה מול כמות נוכחים)
                if (data.understood_count && data.understood_count > 0) {
                    totalUnderstood += data.understood_count;
                    const totalInClass = data.total_attendance || 1; // שולף כמה נכחו
                    const msg = `👍 ${totalUnderstood} מתוך ${totalInClass} תלמידים סימנו שהבינו`;
                    
                    showToast(msg, 'success'); // מציג הודעה ירוקה צפה שאפשר לסגור בדפדפן
                    sendDesktopNotification("✅ עדכון הבנה", msg); // מקפיץ התראה בווינדוס
                }
            } catch (e) { console.error(e); }
        }

        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="close-toast" onclick="this.parentElement.remove()">✖</span><div style="margin-right:20px;">${message}</div>`;
            container.appendChild(toast);
            
            // נעלם אוטומטית אחרי חצי דקה אם המרצה לא סגר בעצמו
            setTimeout(() => {
                if(toast.parentElement) {
                    toast.classList.add('hide');
                    setTimeout(() => toast.remove(), 1000);
                }
            }, 30000); 
        }

        function openVolunteerModal(studentsArray) {
            const tbody = document.getElementById('volunteerTableBody');
            tbody.innerHTML = ''; 
            studentsArray.forEach(student => {
                tbody.innerHTML += `<tr><td>${student.name}</td><td><button onclick="selectStudent('${student.name}')" class="btn">תן דיבור</button></td></tr>`;
            });
            document.getElementById('volunteerModal').style.display = 'flex';
        }

        window.selectStudent = function(name) {
            alert(`בחרת ב-${name}.`);
            document.getElementById('volunteerModal').style.display = 'none';
        }
        document.getElementById('closeModalBtn').addEventListener('click', () => { document.getElementById('volunteerModal').style.display = 'none'; });
    </script>
</body>
</html>
