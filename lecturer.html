<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בקרה למרצה</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .dashboard { background: white; padding: 25px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        
        input[type="text"] { width: 60%; padding: 10px; font-size: 16px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-success { background: #28a745; }
        
        /* אזור ספירת תלמידים / מצלמה */
        #verificationSection { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #ccc; border-radius: 10px; background: #fafafa; }
        #cameraContainer { display: none; margin-top: 15px; }
        video { width: 100%; max-width: 400px; border-radius: 5px; border: 1px solid #ccc; }
        canvas { display: none; }
        #previewImage { width: 100%; max-width: 400px; border-radius: 5px; display: none; margin: 10px auto; }
        
        /* טבלת פידבקים חיה (תוסתר כעת כי אנחנו עוברים למודל צף) */
        #feedbackSection { display: none; margin-top: 30px; text-align: right; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #007bff; color: white; }
        .status-question { background-color: #ffe6e6; }
        .status-volunteer { background-color: #e6f7ff; }
        .status-clear { background-color: #e6ffe6; }

        /* --- עיצוב חדש: התראות צפות (Toasts) ל-30 שניות --- */
        .toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #333; color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); font-size: 16px; opacity: 1; transition: opacity 1s; max-width: 300px; direction: rtl; }
        .toast.hide { opacity: 0; }
        .toast.question { border-right: 5px solid #dc3545; } /* פס אדום לשאלות */
        .toast.understood { border-right: 5px solid #28a745; } /* פס ירוק להבנה */

        /* --- עיצוב חדש: חלון צף (Modal) לטבלת המתנדבים --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 80%; max-width: 500px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); direction: rtl; }
        .modal-content table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .modal-content th, .modal-content td { padding: 10px; border: 1px solid #ddd; }
        .modal-content tr:hover { background-color: #f1f1f1; cursor: pointer; }
        .close-modal-btn { margin-top: 20px; background: #dc3545; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>👨‍🏫 ניהול שיעור חכם</h2>
        
        <!-- שלב 1: פתיחת שיעור -->
        <div id="startSection">
            <input type="text" id="courseName" placeholder="שם הקורס (לדוגמה: מבני נתונים)" required>
            <br>
            <button class="btn" id="startSessionBtn">פתח שיעור והצג QR</button>
        </div>

        <!-- שלב 2: הצגת QR וסגירת רישום -->
        <div id="qrSection" style="display: none;">
            <h3 style="color: #007bff;">קוד השיעור: <span id="sessionTokenDisplay"></span></h3>
            
            <img id="qrImage" src="" alt="QR Code" style="margin: 15px auto; display: block; border: 5px solid white; box-shadow: 0px 0px 5px rgba(0,0,0,0.2);">
            
            <p>התלמידים יכולים כעת להירשם.</p>
            <button class="btn btn-danger" id="closeRegistrationBtn">סגור הרשמה והתחל ספירת תלמידים</button>
        </div>

        <!-- שלב 3: צילום/העלאת תמונה לספירה -->
        <div id="verificationSection">
            <h3>📸 אימות נוכחות (ספירת תלמידים)</h3>
            <p>בחר כיצד לספק תמונה של הכיתה לצורך השוואה מול כמות הנרשמים:</p>
            <button class="btn" id="openCameraBtn">📷 פתח מצלמה</button>
            <button class="btn" id="uploadImageBtn">📁 העלה תמונה</button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">

            <div id="cameraContainer">
                <video id="videoElement" autoplay playsinline></video>
                <br>
                <button class="btn btn-success" id="captureBtn" style="display: none;">צלם תמונה</button>
            </div>
            
            <canvas id="canvasElement"></canvas>
            <img id="previewImage" alt="תצוגה מקדימה">
            
            <br>
            <button class="btn btn-success" id="analyzeBtn" style="display: none; margin-top: 15px; width: 100%;">שלח לספירה אוטומטית</button>
            <h4 id="analysisResult" style="color: #28a745;"></h4>
        </div>
    </div>

    <!-- --- אלמנטים חדשים לממשק צף --- -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-overlay" id="volunteerModal">
        <div class="modal-content">
            <h3>🙋‍♂️ תלמידים שמוכנים לענות</h3>
            <table>
                <thead>
                    <tr>
                        <th>שם התלמיד</th>
                        <th>פעולה</th>
                    </tr>
                </thead>
                <tbody id="volunteerTableBody">
                    <!-- השורות יתווספו כאן אוטומטית -->
                </tbody>
            </table>
            <button class="close-modal-btn" id="closeModalBtn">סגור טבלה ואפס מתנדבים</button>
        </div>
    </div>
    <!-- -------------------------------- -->

    <script>
        const qrImage = document.getElementById('qrImage');
        const startSessionBtn = document.getElementById('startSessionBtn');
        const closeRegistrationBtn = document.getElementById('closeRegistrationBtn');
        const startSection = document.getElementById('startSection');
        const qrSection = document.getElementById('qrSection');
        const verificationSection = document.getElementById('verificationSection');
        const sessionTokenDisplay = document.getElementById('sessionTokenDisplay');
        const courseName = document.getElementById('courseName');

        const openCameraBtn = document.getElementById('openCameraBtn');
        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const fileInput = document.getElementById('fileInput');
        const cameraContainer = document.getElementById('cameraContainer');
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('canvasElement');
        const previewImage = document.getElementById('previewImage');
        const captureBtn = document.getElementById('captureBtn');
        const analyzeBtn = document.getElementById('analyzeBtn');
        
        let currentSessionToken = "";
        let stream = null;

        startSessionBtn.addEventListener('click', async () => {
            if (!courseName.value) return alert('נא להזין שם קורס');
            
            currentSessionToken = Math.random().toString(36).substring(2, 10).toUpperCase();
            
            await fetch('http://127.0.0.1:8000/lecturer/start_session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: currentSessionToken })
            });

            startSection.style.display = 'none';
            qrSection.style.display = 'block';
            sessionTokenDisplay.innerText = currentSessionToken;
            
            qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${currentSessionToken}`;
            
            // התחלת בדיקה מהשרת להתראות צפות (ייכתב בשלב הבא)
        });

       closeRegistrationBtn.addEventListener('click', async () => {
            // שולחים לשרת פקודה לנעול את ה-QR ולעבור לסטטוס locked
            try {
                await fetch('http://127.0.0.1:8000/lecturer/lock_session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: currentSessionToken })
                });
            } catch (err) {
                console.error(err);
            }
            
            qrSection.style.display = 'none';
            verificationSection.style.display = 'block';
        });

        openCameraBtn.addEventListener('click', async () => {
            fileInput.value = ""; 
            previewImage.style.display = "none";
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                videoElement.srcObject = stream;
                cameraContainer.style.display = "block";
                captureBtn.style.display = "inline-block";
                analyzeBtn.style.display = "none";
            } catch (err) {
                alert("לא ניתן לגשת למצלמה. ודא שאישרת הרשאות דפדפן.");
            }
        });

        captureBtn.addEventListener('click', () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasElement.getContext('2d').drawImage(videoElement, 0, 0);
            
            previewImage.src = canvasElement.toDataURL('image/jpeg');
            previewImage.style.display = "block";
            
            stream.getTracks().forEach(track => track.stop());
            cameraContainer.style.display = "none";
            analyzeBtn.style.display = "inline-block";
        });

        uploadImageBtn.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop()); 
            cameraContainer.style.display = "none";
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    previewImage.src = event.target.result;
                    previewImage.style.display = "block";
                    analyzeBtn.style.display = "inline-block";
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        analyzeBtn.addEventListener('click', () => {
            analyzeBtn.innerText = "מנתח תמונה...";
            analyzeBtn.disabled = true;
            
            setTimeout(() => {
                document.getElementById('analysisResult').innerText = "✅ זוהו 15 תלמידים בתמונה. תואם לכמות הרשומים במערכת (15).";
                analyzeBtn.style.display = "none";
            }, 2000);
        });

        // --- לוגיקה חדשה: הודעות צפות (Toasts) וטבלת מתנדבים (Modal) ---
        
        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = message;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 1000);
            }, 30000); 
        }

        const volunteerModal = document.getElementById('volunteerModal');
        const volunteerTableBody = document.getElementById('volunteerTableBody');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // פונקציה לבניית טבלת המתנדבים
        function openVolunteerModal(studentsArray) {
            volunteerTableBody.innerHTML = ''; 
            studentsArray.forEach(student => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${student.name}</td>
                    <td><button onclick="selectStudent('${student.name}')" class="btn" style="padding:5px;">תן רשות דיבור</button></td>
                `;
                volunteerTableBody.appendChild(tr);
            });
            volunteerModal.style.display = 'flex';
        }

        // בחירת תלמיד מהטבלה
        window.selectStudent = function(name) {
            alert(`בחרת ב-${name}. הטבלה תאופס עכשיו.`);
            closeModal();
        }

        // סגירת טבלה
        function closeModal() {
            volunteerModal.style.display = 'none';
            volunteerTableBody.innerHTML = ''; 
        }
        closeModalBtn.addEventListener('click', closeModal);

       
    </script>
</body>
</html>
