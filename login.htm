<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה למערכת</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 90%; padding: 12px; font-size: 16px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }
        .btn { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; }
        .btn:hover { background: #0056b3; }
        #errorMsg { color: red; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>👋 ברוכים הבאים למערכת הלמידה</h2>
        <p>אנא הזן תעודת זהות להתחברות:</p>
        <input type="text" id="userId" placeholder="תעודת זהות (9 ספרות)" required>
        <button class="btn" id="loginBtn">היכנס</button>
        <div id="errorMsg"></div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const userId = document.getElementById('userId').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = "";

            if (!userId) {
                errorMsg.innerText = "נא להזין תעודת זהות";
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:8000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // ניתוב לעמוד המתאים לפי התפקיד
                    if (data.role === 'lecturer') {
                        window.location.href = 'lecturer.html';
                    } else {
                        window.location.href = 'student.html';
                    }
                } else {
                    errorMsg.innerText = "❌ " + data.detail;
                }
            } catch (err) {
                console.error(err);
                errorMsg.innerText = "שגיאת תקשורת מול השרת.";
            }
        });
    </script>
</body>
